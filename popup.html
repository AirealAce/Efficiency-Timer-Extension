<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflection Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Focus with a receipt</p>
        <h1>Reflection Timer</h1>
      </div>
      <button id="openSettings" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
    </header>

    <output id="display" class="timer" aria-live="off">25:00</output>
    <p id="timerStatus" class="timer-status">Ready</p>

    <fieldset id="durationFields" class="duration-fields">
      <legend class="sr-only">Timer duration</legend>
      <label><span>Hours</span><input id="hours" type="number" min="0" max="8760" inputmode="numeric" value="0"></label>
      <span class="colon" aria-hidden="true">:</span>
      <label><span>Minutes</span><input id="minutes" type="number" min="0" max="59" inputmode="numeric" value="25"></label>
      <span class="colon" aria-hidden="true">:</span>
      <label><span>Seconds</span><input id="seconds" type="number" min="0" max="59" inputmode="numeric" value="0"></label>
    </fieldset>

    <div class="primary-actions">
      <button id="startPause" class="primary" type="button">Start</button>
      <button id="reset" class="secondary" type="button">Reset</button>
    </div>

    <section class="preferences" aria-label="Timer preferences">
      <label class="check-row">
        <input id="autoRestart" type="checkbox">
        <span>Automatically start the next session</span>
      </label>
      <label class="range-row">
        <span>Sound</span>
        <input id="volume" type="range" min="0" max="100" value="50">
        <output id="volumeValue">50%</output>
      </label>
    </section>

    <details id="schedulePanel" class="schedule-panel">
      <summary>Schedule a start time</summary>
      <div class="schedule-controls">
        <label for="startTime">Start at</label>
        <input id="startTime" type="datetime-local">
        <button id="schedule" class="secondary" type="button">Schedule</button>
        <button id="cancelSchedule" class="text-button" type="button" hidden>Cancel scheduled start</button>
      </div>
      <p id="scheduleStatus" class="hint"></p>
    </details>

    <div class="footer-actions">
      <button id="testPrompt" class="text-button" type="button">Test reflection prompt</button>
      <span id="currentTime" class="clock"></span>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="timer-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
